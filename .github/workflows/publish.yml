name: publish

# Push a tag such as v0.1.1 to publish. The tag must match the Version in
# vs/TabLinks.Vsix/source.extension.vsixmanifest.
on:
  push:
    tags: [ 'v[0-9]*' ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Check that the tag matches the manifest version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content vs/TabLinks.Vsix/source.extension.vsixmanifest)
          $version = $xml.PackageManifest.Metadata.Identity.Version
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -ne $tag) { throw "Tag $tag does not match manifest version $version." }


      - name: Build VSIX
        run: msbuild vs/TabLinks.Vsix/TabLinks.Vsix.csproj /restore /p:Configuration=Release /v:m

      - name: Create or update the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $vsix = 'vs/TabLinks.Vsix/bin/Release/net48/TabLinks.Vsix.vsix'
          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload '${{ github.ref_name }}' $vsix --clobber
          } else {
            gh release create '${{ github.ref_name }}' $vsix --title 'TabLinks ${{ github.ref_name }}' --generate-notes
          }

      - name: Publish to the Visual Studio Marketplace
        shell: pwsh
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          if (-not $env:VS_MARKETPLACE_PAT) {
            Write-Host "::warning::Secret VS_MARKETPLACE_PAT is not set. The Marketplace upload was skipped."
            exit 0
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $tool = & $vswhere -latest -products * -find 'VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe' | Select-Object -First 1
          if (-not $tool) { throw 'VsixPublisher.exe was not found on this runner.' }
          & $tool publish `
            -payload 'vs/TabLinks.Vsix/bin/Release/net48/TabLinks.Vsix.vsix' `
            -publishManifest 'vs-publish.json' `
            -personalAccessToken $env:VS_MARKETPLACE_PAT
          if ($LASTEXITCODE -ne 0) { throw "VsixPublisher failed with exit code $LASTEXITCODE." }
